<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="AquaClock" />
    <meta name="theme-color" content="#04141c" />
    <title>Aqua Clock — where the fish tell the time</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        color-scheme: dark;
        --ink: #eaf3f7;
        --muted: rgba(226, 240, 232, 0.56);
        --faint: rgba(226, 240, 232, 0.34);
        --line: rgba(186, 222, 238, 0.12);
        --glass: rgba(10, 26, 36, 0.44);
        --accent: #6ec7de;
        --sand: #e9d6a9;
        --bg: #0a2a42;
      }
      :root:not([data-theme='light']) { --bg: #0a2a42; }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; }
      body {
        background: var(--bg);
        color: var(--ink);
        font-family: Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-weight: 300;
        -webkit-font-smoothing: antialiased;
        overflow: hidden;
      }
      #scene {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
        outline: none;
      }
      .scrim {
        position: fixed;
        inset: 0;
        pointer-events: none;
        background:
          radial-gradient(120% 90% at 50% 50%, transparent 42%, rgba(4, 18, 30, 0.42) 100%),
          linear-gradient(180deg, rgba(4, 18, 30, 0.55) 0%, transparent 24%, transparent 70%, rgba(4, 18, 30, 0.44) 100%);
      }
      .boot {
        position: fixed;
        inset: 0;
        background: var(--bg);
        transition: opacity 1s ease;
        pointer-events: none;
        z-index: 40;
      }
      .boot[data-ready='true'] { opacity: 0; }

      .page {
        position: relative;
        z-index: 10;
        height: 100%;
        display: flex;
        flex-direction: column;
        max-width: 1200px;
        margin: 0 auto;
        padding: 0 28px;
      }

      nav {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 22px 0;
      }
      .brand { display: flex; align-items: center; gap: 12px; }
      .brand img {
        width: 34px; height: 34px; border-radius: 10px;
        box-shadow: 0 6px 20px rgba(0, 0, 0, 0.45);
      }
      .brand span { font-size: 16px; letter-spacing: -0.01em; font-weight: 400; }
      .links { display: flex; gap: 30px; font-size: 13.5px; color: var(--muted); }
      .links a { color: inherit; text-decoration: none; transition: color 0.2s; }
      .links a:hover { color: var(--ink); }
      .pill {
        border: 1px solid var(--line);
        background: var(--glass);
        backdrop-filter: blur(14px);
        color: var(--ink);
        padding: 8px 18px;
        border-radius: 999px;
        font-size: 13.5px;
        font-family: inherit;
        font-weight: 400;
        cursor: pointer;
        text-decoration: none;
        transition: border-color 0.2s, background 0.2s;
      }
      .pill:hover { border-color: rgba(110, 199, 222, 0.4); }

      main {
        flex: 1;
        display: flex;
        align-items: flex-end; padding-bottom: 20px;
        min-height: 0;
      }
      .copy { max-width: 560px; }
      .eyebrow {
        display: inline-flex;
        align-items: center;
        gap: 9px;
        font-size: 10.5px;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: rgba(110, 199, 222, 0.85);
        border: 1px solid rgba(110, 199, 222, 0.22);
        background: rgba(16, 48, 64, 0.4);
        padding: 7px 14px;
        border-radius: 999px;
        margin-bottom: 26px;
      }
      .dot {
        width: 6px; height: 6px; border-radius: 50%;
        background: var(--accent);
        animation: pulse 2.6s ease-in-out infinite;
      }
      @keyframes pulse { 0%, 100% { opacity: 1 } 50% { opacity: 0.25 } }

      h1 {
        font-size: clamp(2.6rem, 6vw, 4.5rem);
        font-weight: 200;
        line-height: 1.04;
        letter-spacing: -0.035em;
        margin: 0 0 22px;
      }
      h1 em {
        font-style: normal;
        font-weight: 400;
        color: var(--sand);
      }
      .sub {
        font-size: clamp(1rem, 1.4vw, 1.12rem);
        line-height: 1.65;
        color: rgba(226, 240, 232, 0.82); /* brighter than --muted, which was too dim over the planting */
        margin: 0 0 34px;
        max-width: 46ch;
      }
      .cta { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
      .cta .primary {
        background: var(--ink);
        color: #02121a;
        border: none;
        padding: 14px 26px;
        border-radius: 999px;
        font-size: 14.5px;
        font-weight: 500;
        font-family: inherit;
        cursor: pointer;
        text-decoration: none;
        display: inline-flex;
        align-items: center;
        gap: 9px;
        transition: transform 0.2s;
      }
      .cta .primary:hover { transform: translateY(-1px); }

      footer {
        display: flex;
        justify-content: space-between;
        align-items: flex-end;
        padding: 0 0 26px;
        font-size: 11.5px;
        color: rgba(226, 240, 232, 0.6); /* brighter than --faint, which was too dim over the planting */
        letter-spacing: 0.02em;
      }
      .status { display: flex; gap: 22px; }
      .status b { font-weight: 400; color: rgba(226, 240, 232, 0.82); }

      /* iOS Safari: 100% can be taller than what is actually visible */
      @supports (height: 100dvh) { .page { height: 100dvh; } }
      .cta .primary, .cta .pill { min-height: 44px; }
      /* upright screens: the stacked digits sit mid-screen, so the words go below them,
         over the empty substrate, rather than across the middle */
      @media (max-aspect-ratio: 1/1) {
        main { align-items: flex-end; padding: 0 0 18px; }
        h1 { font-size: clamp(2rem, 9vw, 3rem); margin-bottom: 12px; }
        .sub { font-size: 0.94rem; line-height: 1.5; margin-bottom: 18px; }
        .eyebrow { margin-bottom: 14px; }
      }
      /* short screens: one line and no paragraph, so the words take little room and the clock keeps its own */
      @media (max-height: 640px) {
        h1 { font-size: clamp(1.8rem, 3.6vw, 2.6rem); margin-bottom: 14px; white-space: nowrap; }
        h1 br { display: none; }
        h1 em::before { content: ' '; }
        .sub { display: none; }
      }
      /* a phone held upright has no room for prose or stats: the tank is the page */
      @media (max-aspect-ratio: 1/1) and (max-width: 600px) {
        .sub, .eyebrow, .stat { display: none; }
        main { padding-bottom: 8px; }
      }
      /* a soft dark halo behind the words, so they stay legible over the busy planting. Not on
         the buttons: dark text on a white pill would only blur. */
      .page h1, .page .brand {
        text-shadow: 0 1px 3px rgba(3, 12, 18, 0.7), 0 0 26px rgba(3, 12, 18, 0.6);
      }
      /* small, light text needs a denser halo than the headline does */
      .page .sub, .page footer {
        text-shadow: 0 0 2px rgba(3, 12, 18, 0.95), 0 0 9px rgba(3, 12, 18, 0.9), 0 0 22px rgba(3, 12, 18, 0.65);
      }
      /* ---- reaching Full screen on a phone ----
         The button at the top right can sit under a browser's or viewer's own header, or a notch,
         and then it cannot be reached. On touch screens and small windows there is a second one in
         the button row, down where the thumb is, and the top one steps aside. The page also keeps
         clear of the notch and rounded corners. */
      .cta { flex-wrap: wrap; align-items: center; }
      .iconbtn { display: none; width: 44px; height: 44px; padding: 0; align-items: center; justify-content: center; }
      .iconbtn svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
      @media (pointer: coarse), (max-width: 760px), (max-height: 500px) {
        .iconbtn { display: inline-flex; }
        #fullview { display: none; }
      }
      .page { padding-left: max(28px, env(safe-area-inset-left, 0px)); padding-right: max(28px, env(safe-area-inset-right, 0px)); }
      nav { padding-top: max(22px, env(safe-area-inset-top, 0px)); }
      @media (max-width: 760px) {
        .page { padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px)); }
      }
      /* a quiet link to the source, in the footer */
      /* padding with an equal negative margin: a thumb-sized target that does not move the layout */
      footer a.gh { display: inline-block; padding: 14px 10px; margin: -14px -10px; color: rgba(220, 236, 228, 0.78); text-decoration: underline; text-decoration-color: rgba(220, 236, 228, 0.3); text-underline-offset: 3px; }
      footer a.gh:hover, footer a.gh:focus-visible { color: #fff; text-decoration-color: rgba(255, 255, 255, 0.7); }
      /* the bottom-right corner belongs to the air stone: hint above stats, both at the left */
      footer { flex-direction: column-reverse; align-items: flex-start; gap: 6px; }
      /* ---- full screen view: the tank and nothing else ---- */
      .fullui {
        position: fixed; left: 50%; z-index: 5; display: none; gap: 6px; padding: 6px;
        bottom: calc(22px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%);
        border-radius: 999px; background: rgba(4, 14, 11, 0.55); backdrop-filter: blur(10px);
        border: 1px solid rgba(160, 200, 180, 0.18);
        opacity: 0; pointer-events: none; transition: opacity 0.35s ease;
      }
      .fullui button {
        width: 46px; height: 46px; border-radius: 50%; border: 0; background: transparent;
        color: #dcece4; display: grid; place-items: center; cursor: pointer; padding: 0;
      }
      .fullui button:hover { background: rgba(255, 255, 255, 0.1); }
      .fullui svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
      body.full .fullui { display: flex; }
      body.full.awake .fullui { opacity: 1; pointer-events: auto; }
      body.full .page, body.full .scrim { display: none; }
      body.full.idle, body.full.idle canvas { cursor: none; }
      @media (max-width: 760px) {
        .links { display: none; }
        .page { padding: 0 20px; }
        footer { flex-direction: column; align-items: flex-start; gap: 8px; }
      }
      @media (prefers-reduced-motion: reduce) {
        .dot { animation: none; }
      }
    </style>
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js"
        }
      }
    </script>
  </head>
  <body>
    <canvas id="scene" tabindex="0" aria-label="Live 3D freshwater aquarium. The fish gather to form the time."></canvas>
    <div class="scrim"></div>
    <div class="fullui" id="fullui">
      <button type="button" id="fu-time" aria-label="Show the time"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg></button>
      <button type="button" id="fu-feed" aria-label="Feed the fish"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="8" cy="9" r="2"/><circle cx="15.5" cy="7.5" r="1.6"/><circle cx="12" cy="14" r="2.2"/><circle cx="17.5" cy="16" r="1.5"/><circle cx="6.5" cy="17" r="1.4"/></svg></button>
      <button type="button" id="fu-exit" aria-label="Exit full screen"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5"/></svg></button>
    </div>
    <div class="boot" id="boot" aria-hidden="true"></div>

    <div class="page">
      <nav>
        <div class="brand"><span>AquaClock</span></div>
        <button class="pill" id="fullview" type="button">Full screen</button>
      </nav>

      <main>
        <div class="copy">
          
          <h1>Where the fish<br /><em>tell the time.</em></h1>
          <p class="sub">
          A planted freshwater tank that lives in your browser. The shoal swims and feeds — then, on every minute, gathers to tell the time.
        </p>
          <div class="cta">
            <button class="primary" id="showtime" type="button">Show the time</button>
            <button class="pill" id="feed" type="button">Feed the fish</button>
          <button class="pill iconbtn" id="fullview2" type="button" aria-label="Full screen"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
          </div>
        </div>
      </main>

      <footer>
        <div class="status">
          <span class="stat"><b id="fishcount">84</b> neons, <b>2</b> clowns</span>
          <span class="stat">seven-segment digits</span>
          <span>render <b id="state">…</b></span>
          <span class="stat">forms <b>on the minute</b></span>
          <span><a class="gh" href="https://github.com/digitalurban/Aqua_Clock_Web" target="_blank" rel="noopener">Source on GitHub</a></span>
        </div>
      </footer>
    </div>

        /* glsl */ `
        #include <color_fragment>
        vec3 mossFuzz = vec3(0.0);
        if (vMoss > 0.02) {
          float mossFine = mossNoise(vWaterPosition * 9.0) * 0.6 + mossNoise(vWaterPosition * 27.0) * 0.4;
          gMoss = smoothstep(0.07, 0.5, vMoss + (mossFine - 0.5) * 0.45);
          gMossColor = mix(mossFilm, mossTurf, smoothstep(0.15, 0.85, vMoss)) * (0.6 + 0.8 * mossFine);
          // Growth lies in the same shade as the surface it grows on: the pit of a stone,
          // a split in the bark, the sand under the canopy.
          #ifdef USE_COLOR
            gMossColor *= vColor;
          #endif
          diffuseColor.rgb = mix(diffuseColor.rgb, gMossColor, gMoss);
          mossFuzz = vec3(mossFine - 0.5, mossNoise(vWaterPosition * 31.0 + 7.0) - 0.5, fract(mossFine * 7.0) - 0.5);
        }
      `,
      )
      .replace(
        "#include <roughnessmap_fragment>",
        "#include <roughnessmap_fragment>\nroughnessFactor = mix(roughnessFactor, 1.0, gMoss);",
      )
      .replace(
        "#include <normal_fragment_maps>",
        /* glsl */ `
        #include <normal_fragment_maps>
        normal = normalize(normal + gMoss * 0.5 * mossFuzz);
      `,
      )
      .replace(
        "#include <lights_fragment_end>",
        /* glsl */ `
        #include <lights_fragment_end>
        float grazing = pow(1.0 - saturate(dot(normal, geometryViewDir)), 3.0);
        reflectedLight.indirectDiffuse += gMoss * grazing * gMossColor * 0.6;
      `,
      );
    waterLitShader(shader);
  };
  material.customProgramCacheKey = () => "mossy-surface-v3";
  return material;
}

// A young film of algae is olive and thin; established turf is dark green. The film on
// sand is browner (diatoms) than on stone and wood.
async function surface(loader, name, repeat, color, film, turf = "#0b1e08") {
  // PATCH (Aqua Clock): the page is self-contained, so the Poly Haven maps are
  // inlined as data URIs rather than fetched from assets/.
  const [map, normalMap] = await Promise.all([
    loader.loadAsync(TEXTURES[`${name}_diff`]),
    loader.loadAsync(TEXTURES[`${name}_nor_gl`]),
  ]);
  map.colorSpace = THREE.SRGBColorSpace;
  for (const texture of [map, normalMap]) {
    texture.wrapS = texture.wrapT = THREE.RepeatWrapping;
    texture.repeat.set(...repeat);
    texture.anisotropy = 8;
  }
  return mossLayer(
    new THREE.MeshStandardMaterial({
      map,
      normalMap,
      color,
      roughness: 0.92,
      normalScale: new THREE.Vector2(0.65, 0.65),
      vertexColors: true,
    }),
    film,
    turf,
  );
}

function rockGeometry(seed, detail = 112) {
  const geometry = new THREE.SphereGeometry(
    1,
    detail,
    Math.floor(detail * 0.7),
  );
  const positions = geometry.attributes.position;
  const color = new THREE.Color();
  const colors = [];
  const planes = [];
  const sample = randomGenerator(Math.round(seed * 1000) + 27461);
  const pits = [];
  if (detail > 20)
    for (let i = 0; i < 115; i++) {
      const y = sample() * 2 - 1,
        a = sample() * Math.PI * 2,
        r = Math.sqrt(1 - y * y);
      const radius = 0.022 + sample() ** 2 * 0.18;
      pits.push({
        x: Math.cos(a) * r,
        y,
        z: Math.sin(a) * r,
        radius,
        depth: radius * (0.3 + sample() * 0.8),
      });
    }
  for (let i = 0; i < 15; i++) {
    const a = i * 2.399963 + seed,
      y = 1 - (2 * (i + 0.5)) / 15,
      r = Math.sqrt(1 - y * y);
    planes.push({
      normal: vec(Math.cos(a) * r, y, Math.sin(a) * r),
      distance: 0.76 + noise(i, seed, 4) * 0.35,
    });
  }
  for (let i = 0; i < positions.count; i++) {
    const x = positions.getX(i),
      y = positions.getY(i),
      z = positions.getZ(i);
    const a = noise(x * 2.5 + seed, y * 2.5, z * 2.5);
    const b = noise(x * 7 + seed, y * 7, z * 7);
    const c = noise(x * 22 + seed, y * 22, z * 22);
    const strata = Math.pow(
      Math.abs(Math.sin(x * 3.2 + y * 9 + z * 2.7 + a * 6)),
      18,
    );
    let radius = 1.28;
    for (const plane of planes) {
      const dot = x * plane.normal.x + y * plane.normal.y + z * plane.normal.z;
      if (dot > 0) radius = Math.min(radius, plane.distance / dot);
    }
    radius +=
      (a - 0.5) * 0.1 + (b - 0.5) * 0.055 + (c - 0.5) * 0.023 - strata * 0.017;
    let depression = 0;
    let rim = 0;
    for (const pit of pits) {
      const d =
        Math.sqrt(
          (x - pit.x) ** 2 + ((y - pit.y) * 1.17) ** 2 + (z - pit.z) ** 2,
        ) / pit.radius;
      if (d < 1) depression += pit.depth * (1 - d * d) ** 0.65;
      else if (d < 1.2) rim += (1.2 - d) * 0.1;
    }
    radius -= Math.min(0.25, depression);
    positions.setXYZ(i, x * radius, y * radius, z * radius);
    color
      .setRGB(1, 0.985, 0.945)
      .multiplyScalar(
        (0.8 + 0.2 * a + rim) * (1 - Math.min(0.52, depression * 2.1)),
      );
    colors.push(color.r, color.g, color.b);
  }
  geometry.setAttribute("color", new THREE.Float32BufferAttribute(colors, 3));
  geometry.computeVertexNormals();
  return geometry;
}

function branchGeometry(points, baseRadius, tipRadius, seed) {
  const curve = new THREE.CatmullRomCurve3(points);
  const length = curve.getLength();
  const rows = Math.ceil(length * 30),
    cols = 96;
  // PATCH (Aqua Clock): Habitats' branches are all thin, so mapping the bark texture once
  // round the circumference was fine. On a thick log it stretches the texture several times
  // wider than it is tall and reads as horizontal slabs. Repeat it in step with the
  // circumference (a whole number, so it still meets itself at the seam), and make the splits
  // shallower on thick pieces.
  const uRepeat = Math.max(1, Math.round(baseRadius / 0.3));
  const splitScale = Math.min(1, 0.5 / baseRadius);
  const positions = [],
    uv = [],
    indices = [],
    colors = [];
  const frames = curve.computeFrenetFrames(rows, false);
  const splitRandom = randomGenerator(Math.round(seed * 1000) + 51781);
  const splits = Array.from({ length: 6 }, () => ({
    a: splitRandom() * Math.PI * 2,
    t: splitRandom(),
    width: 0.025 + splitRandom() * 0.09,
    length: 0.025 + splitRandom() * 0.15,
    depth: (0.08 + splitRandom() * 0.32) * splitScale,
  }));
  for (let i = 0; i <= rows; i++) {
    const t = i / rows,
      p = curve.getPointAt(t);
    const radius = THREE.MathUtils.lerp(
      baseRadius,
      tipRadius,
      Math.pow(t, 0.8),
    );
    for (let j = 0; j <= cols; j++) {
      const a = (j / cols) * Math.PI * 2;
      // PATCH (Aqua Clock): long, flowing grain instead of spiralling ridges and warts. On
      // Habitats' thin branches the original read as bark; on a thick trunk it read as a
      // gherkin. The ridges barely twist along the length, and the weathering is broad.
      const ridges =
        0.05 * Math.sin(a * 9 + t * 2.5 + seed) +
        0.022 * Math.sin(a * 17 - t * 1.5) +
        0.008 * Math.sin(a * 31 + t * 4);
      const weather = noise(Math.cos(a) * 3 + seed, t * 5, Math.sin(a) * 3);
      const channel =
        Math.pow(0.5 + 0.5 * Math.sin(a * 13 + Math.sin(t * 15) * 0.25), 10) *
        0.07;
      const knot = 1 + 0.05 * Math.exp(-(((t - 0.47) / 0.12) ** 2));
      let splitDepth = 0;
      for (const split of splits) {
        const angle = a - split.a - 0.07 * Math.sin(t * 37 + seed);
        const around =
          Math.atan2(Math.sin(angle), Math.cos(angle)) / split.width;
        const along = (t - split.t) / split.length;
        const distance = around * around + along * along;
        if (distance < 1)
          splitDepth += split.depth * Math.pow(1 - distance, 0.6);
      }
      const r =
        radius *
        knot *
        (1 +
          ridges +
          (weather - 0.5) * 0.12 -
          channel -
          Math.min(0.65, splitDepth));
      const radial = frames.normals[i]
        .clone()
        .multiplyScalar(Math.cos(a))
        .addScaledVector(frames.binormals[i], Math.sin(a));
      const v = p.clone().addScaledVector(radial, r);
      positions.push(v.x, v.y, v.z);
      uv.push((j / cols) * uRepeat, length * t * 0.32);
      const tint =
        (0.7 + weather * 0.27 + ridges * 0.7 - channel) *
        (1 - Math.min(0.6, splitDepth * 1.5));
      colors.push(tint, tint * 0.97, tint * 0.92);
      if (i < rows && j < cols) {
        const k = i * (cols + 1) + j;
        indices.push(k, k + 1, k + cols + 1, k + 1, k + cols + 2, k + cols + 1);
      }
    }
  }
  // Close the weathered tips; the narrower branches intersect inside their parent.
  for (const i of [0, rows]) {
    const p = curve.getPointAt(i / rows),
      k = positions.length / 3;
    positions.push(p.x, p.y, p.z);
    uv.push(0.5, 0.5);
    colors.push(0.38, 0.32, 0.23);
    for (let j = 0; j < cols; j++) {
      if (i === 0) indices.push(k, j + 1, j);
      else indices.push(k, i * (cols + 1) + j, i * (cols + 1) + j + 1);
    }
  }
  const geometry = new THREE.BufferGeometry();
  geometry.setAttribute(
    "position",
    new THREE.Float32BufferAttribute(positions, 3),
  );
  geometry.setAttribute("uv", new THREE.Float32BufferAttribute(uv, 2));
  geometry.setAttribute("color", new THREE.Float32BufferAttribute(colors, 3));
  geometry.setIndex(indices);
  geometry.computeVertexNormals();
  return geometry;
}

function createContactShadows(scene, rocks) {
  const canvas = document.createElement("canvas");
  canvas.width = canvas.height = 128;
  const context = canvas.getContext("2d");
  const gradient = context.createRadialGradient(64, 64, 5, 64, 64, 64);
  gradient.addColorStop(0, "rgba(0,0,0,.85)");
  gradient.addColorStop(0.42, "rgba(0,0,0,.48)");
  gradient.addColorStop(1, "rgba(0,0,0,0)");
  context.fillStyle = gradient;
  context.fillRect(0, 0, 128, 128);
  const map = new THREE.CanvasTexture(canvas);
  const material = new THREE.MeshBasicMaterial({
    map,
    transparent: true,
    depthWrite: false,
    opacity: 0.67,
    polygonOffset: true,
    polygonOffsetFactor: -1,
  });
  for (const rock of rocks) {
    const plane = new THREE.Mesh(
      new THREE.PlaneGeometry(rock.rx * 3.5, rock.rz * 3.5),
      material,
    );
    plane.rotation.x = -Math.PI / 2;
    plane.position.set(rock.x, groundHeight(rock.x, rock.z) + 0.008, rock.z);
    scene.add(plane);
  }
}

// One moss frond: a short curved stem carrying pairs of tiny leaflets. Instances differ in
// size, lean and colour with the coverage where they grow.
function frondGeometry() {
  const positions = [],
    colors = [],
    indices = [];
  const stem = new THREE.QuadraticBezierCurve3(
    vec(0, 0, 0),
    vec(0.02, 0.11, 0.01),
    vec(0.07, 0.2, 0.03),
  );
  const push = (p, color) => {
    positions.push(p.x, p.y, p.z);
    colors.push(color.r, color.g, color.b);
    return positions.length / 3 - 1;
  };
  const stemColor = new THREE.Color("#3a5a1e");
  const segments = 4;
  for (let i = 0; i <= segments; i++) {
    const t = i / segments,
      p = stem.getPoint(t),
      radius = 0.0035 * (1 - 0.6 * t);
    for (let j = 0; j < 3; j++) {
      const a = (j / 3) * TAU;
      push(p.clone().add(vec(Math.cos(a) * radius, 0, Math.sin(a) * radius)), stemColor);
      if (i < segments) {
        const k = i * 3 + j,
          next = i * 3 + ((j + 1) % 3);
        indices.push(k, k + 3, next, next, k + 3, next + 3);
      }
    }
  }
  for (let i = 0; i < 6; i++) {
    const t = 0.2 + i * 0.15,
      base = stem.getPoint(t),
      tangent = stem.getTangent(t);
    for (const side of [-1, 1]) {
      const out = vec(side, 0.55 + 0.1 * (i % 2), 0.45 * side * (i % 2 ? 1 : -1)).normalize();
      out.addScaledVector(tangent, -out.dot(tangent) * 0.4).normalize();
      const across = new THREE.Vector3().crossVectors(out, tangent).normalize();
      const length = 0.042 * (1 - 0.08 * i),
        width = 0.017;
      const shade = new THREE.Color().setHSL(0.245 + 0.015 * side, 0.65, 0.22 + 0.05 * t);
      const a = push(base, shade);
      const b = push(base.clone().addScaledVector(out, length * 0.5).addScaledVector(across, width * 0.5), shade);
      const c = push(base.clone().addScaledVector(out, length), shade.clone().multiplyScalar(1.15));
      const d = push(base.clone().addScaledVector(out, length * 0.5).addScaledVector(across, -width * 0.5), shade);
      indices.push(a, b, c, a, c, d);
    }
  }
  const geometry = new THREE.BufferGeometry();
  geometry.setAttribute("position", new THREE.Float32BufferAttribute(positions, 3));
  geometry.setAttribute("color", new THREE.Float32BufferAttribute(colors, 3));
  geometry.setIndex(indices);
  geometry.computeVertexNormals();
  return geometry;
}

// Fronds stand where the turf is dense. They grow up toward the light more than straight
// off the surface, lean at random, and are picked by weighted sampling so the count is fixed.
function plantFronds(scene, groups) {
  const total = groups.reduce((sum, group) => sum + group.count, 0);
  const material = new THREE.MeshStandardMaterial({
    vertexColors: true,
    roughness: 0.95,
    side: THREE.DoubleSide,
  });
  material.onBeforeCompile = (shader) => waterLitShader(shader);
  material.customProgramCacheKey = () => "moss-frond-v1";
  const fronds = new THREE.InstancedMesh(frondGeometry(), material, total);
  const object = new THREE.Object3D(),
    up = new THREE.Vector3(),
    color = new THREE.Color();
  let index = 0;
  for (const { samples, count, scale = 1 } of groups) {
    const weights = samples.map((s) => Math.max(0, s.coverage - 0.3) ** 2.2);
    const sum = weights.reduce((a, b) => a + b, 0);
    for (let i = 0; i < count; i++) {
      let pick = random() * sum,
        j = 0;
      while (j < weights.length - 1 && pick > weights[j]) pick -= weights[j++];
      const { position, normal, coverage } = samples[j];
      up.copy(normal).lerp(vec(0, 1, 0), 0.4).normalize();
      up.add(vec(range(-0.3, 0.3), range(-0.15, 0.15), range(-0.3, 0.3))).normalize();
      object.position.copy(position).addScaledVector(normal, -0.01);
      object.position.add(vec(range(-0.03, 0.03), 0, range(-0.03, 0.03)));
      object.quaternion.setFromUnitVectors(vec(0, 1, 0), up);
      object.rotateY(range(0, TAU));
      const size = (0.4 + coverage * 0.8) * range(0.5, 1.6) * scale;
      object.scale.set(size * range(0.8, 1.2), size, size * range(0.8, 1.2));
      object.updateMatrix();
      fronds.setMatrixAt(index, object.matrix);
      color.setHSL(0.25 + range(-0.02, 0.02), 0.55, 0.42 - coverage * 0.2 + range(-0.05, 0.05));
      fronds.setColorAt(index, color);
      index++;
    }
  }
  fronds.receiveShadow = true;
  scene.add(fronds);
}

async function createEnvironment(scene) {
  const loader = new THREE.TextureLoader();
  const [rockMaterial, woodMaterial, sandMaterial] = await Promise.all([
    surface(loader, "rock_boulder_dry", [1.8, 1.4], 0x62665d, "#2e4315"),
    // PATCH (Aqua Clock): a paler, warmer tan, closer to cured driftwood
    surface(loader, "rough_wood", [2.1, 1.4], 0xeccb9a, "#334a16"),
    // PATCH (Aqua Clock): the sand is 44 wide, not 24 (see `ground` below), so its texture repeats
    // 18 times across it, not 10, which keeps the grain the same size.
    surface(loader, "sand_01", [18, 6], 0xf4e5c8, "#5a5a26", "#23401a"),
  ]);
  rockMaterial.normalScale.set(0.85, 0.85);
  woodMaterial.roughness = 0.86;
  // PATCH (Aqua Clock): softer bark relief, for weathered driftwood rather than raw bark
  woodMaterial.normalScale.set(0.3, 0.3);
  woodMaterial.normalScale.set(0.8, 0.8);
  sandMaterial.normalScale.set(0.32, 0.32);

  const rocks = ROCKS;
  // PATCH (Aqua Clock): with no wood, sand gathers at the foot of our tall stone instead
  const woodBase = BRANCHES.length ? vec(...BRANCHES[0].p[0]) : vec(3.0, 0, -1.3);
  // How sheltered the sand is from the flow: against the stones and the foot of the wood,
  // and under the back planting.
  const shelterAt = (x, z) => {
    let shelter = 0;
    for (const r of rocks) {
      const size = Math.max(r.rx, r.rz);
      const gap = Math.hypot(x - r.x, z - r.z) - size;
      shelter = Math.max(shelter, smoothstep(0.6 + 0.8 * size, 0.1, gap));
    }
    shelter = Math.max(
      shelter,
      smoothstep(2.2, 0.3, Math.hypot(x - woodBase.x, z - woodBase.z)),
    );
    return Math.max(shelter, 0.55 * smoothstep(-1.4, -3.2, z));
  };
  // Algae films the sheltered sand; the open channel is swept nearly clean.
  const sandShelter = (p) => shelterAt(p.x, p.z) * (1 - 0.85 * channel(p.x, p.z));
  // Relative sediment density: grit and pebbles gather where the sand is sheltered and
  // along the banks of the channel, where the flow leaving it slackens.
  const sediment = (x, z) => {
    const open = channel(x, z);
    const bank = smoothstep(0.55, 0.2, open) * smoothstep(0.02, 0.1, open);
    return (0.06 + 1.3 * shelterAt(x, z) + 0.6 * bank) * (1 - 0.85 * open);
  };
  // A spot on the sand drawn with probability rising with the sediment there; `floor` is
  // the share that falls everywhere regardless.
  const sedimentSpot = (minX, maxX, minZ, maxZ, floor = 0) => {
    for (;;) {
      const x = range(minX, maxX),
        z = range(minZ, maxZ);
      if (random() * 2 < floor + (1 - floor) * sediment(x, z)) return [x, z];
    }
  };

  // PATCH (Aqua Clock): 44 wide, to match the back panel, with the same vertex density. Habitats'
  // 24 is just wide enough for its own lens; the full screen view here is wider, and showed the
  // ends of the sand as the edges of an island.
  const ground = new THREE.PlaneGeometry(44, 18, 367, 140);
  ground.rotateX(-Math.PI / 2);
  const position = ground.attributes.position;
  const groundColors = [];
  for (let i = 0; i < position.count; i++) {
    const x = position.getX(i),
      z = position.getZ(i);
    position.setY(i, groundHeight(x, z) + 0.008 * noise(x * 40, 0, z * 40));
    // Sand darkens under the canopy toward the back; the open channel stays lit further in.
    const lit = THREE.MathUtils.smoothstep(z, -4.4, 0.6);
    const litChannel = THREE.MathUtils.smoothstep(z, -6.0, -1.2);
    const shade = 0.04 + 0.96 * Math.max(lit, litChannel * channel(x, z));
    groundColors.push(shade, shade, shade);
  }
  ground.setAttribute(
    "color",
    new THREE.Float32BufferAttribute(groundColors, 3),
  );
  ground.computeVertexNormals();
  const sand = new THREE.Mesh(ground, sandMaterial);
  sand.receiveShadow = true;
  scene.add(sand);
  // Only the most sheltered sand films over; a healthy riverbed is mostly clean.
  const sandSamples = growMoss(
    ground,
    sand.matrix,
    (p) => 0.4 * sandShelter(p),
    -0.26,
  ).filter((s) => s.position.z > -3.6 && Math.abs(s.position.x) < 9.5);

  const obstacles = [];
  const landmarks = [];
  const rockSamples = [];
  // The pale stone is a lighter piece of the same rock, not a second kind of stone.
  const pale = mossLayer(rockMaterial.clone(), "#2e4315", "#0b1e08");
  pale.color.set(0x8f8b7c);
  rocks.forEach((r, i) => {
    const geometry = rockGeometry(i * 2.63, lodCount(112, LOD.rockDetail, 24));
    // The stone map was tuned on a stone about a unit across; a bigger stone repeats it
    // more, so its grain stays as fine as a small stone's instead of stretching.
    const grain = Math.max(0.8, (r.rx + r.ry + r.rz) / 3.3);
    const uv = geometry.attributes.uv;
    for (let k = 0; k < uv.count; k++)
      uv.setXY(k, uv.getX(k) * grain, uv.getY(k) * grain);
    const mesh = new THREE.Mesh(geometry, r.pale ? pale : rockMaterial);
    mesh.scale.set(r.rx, r.ry, r.rz);
    mesh.position.set(r.x, rockCenterY(r), r.z);
    // The lean is applied after the stone's turn, about the tank's front axis, so the
    // stones share a direction however each one is turned.
    mesh.rotation.set(range(-0.1, 0.1), range(-3, 3), r.lean, "ZYX");
    mesh.updateMatrix();
    mesh.castShadow = mesh.receiveShadow = true;
    scene.add(mesh);
    // Crevices shelter spores: the darker the stone (its pits), the more growth.
    const tints = mesh.geometry.attributes.color;
    rockSamples.push(
      ...growMoss(
        mesh.geometry,
        mesh.matrix,
        (p, index) =>
          0.6 * (1 - tints.getX(index)) +
          0.3 * smoothstep(0.9, 0.2, p.y - groundHeight(p.x, p.z)),
        0.1,
      ),
    );
    const radius = Math.max(r.rx, r.ry, r.rz) * 0.82;
    // PATCH (Aqua Clock): the obstacle also carries the stone's mesh, so the shrimp can climb on it
    // and sit on its real surface. Nothing else reads this property.
    obstacles.push({ center: mesh.position.clone(), radius, mesh });
    if (radius > 0.5)
      landmarks.push({
        kind: "rock",
        point: mesh.position.clone().add(vec(0, r.ry * 0.85, r.rz * 0.55)),
        obstacle: obstacles.length - 1,
      });
  });
  createContactShadows(scene, rocks);

  const smallRockGeometry = rockGeometry(37, 12);
  smallRockGeometry.setAttribute(
    "moss",
    new THREE.BufferAttribute(new Float32Array(smallRockGeometry.attributes.position.count), 1),
  );
  const gravel = new THREE.InstancedMesh(smallRockGeometry, rockMaterial, lodCount(340, LOD.particles, 90));
  const matrix = new THREE.Object3D(),
    color = new THREE.Color();
  for (let i = 0; i < gravel.count; i++) {
    const [x, z] = sedimentSpot(-8.7, 8.7, -3.2, 3.1);
    // Mostly small, a few large, and the large ones lie where the flow dropped them, by
    // the stones; only fine grains stay in the swept channel. Pebbles lie flat, part sunk
    // in the sand. They are the same rock as the stones.
    const s =
      (0.02 + 0.1 * random() ** 2.4) *
      (0.7 + 0.8 * Math.min(1, sediment(x, z))) *
      (1 - 0.45 * channel(x, z));
    matrix.position.set(x, groundHeight(x, z) + s * 0.3, z);
    matrix.scale.set(s * range(0.8, 1.35), s * range(0.45, 0.8), s);

      const lobe = Math.abs(u) ** 1.3 * (1 - 0.32 * Math.abs(u) ** 8);
      const frame = frameAt(frames, v - reach * basal * lobe);
      const spin = twist * v;
      const side = frame.side
        .clone()
        .multiplyScalar(Math.cos(spin))
        .addScaledVector(frame.normal, Math.sin(spin));
      const normal = frame.normal
        .clone()
        .multiplyScalar(Math.cos(spin))
        .addScaledVector(frame.side, -Math.sin(spin));
      let across = u * edge;
      let out = 0;
      if (roll > 0.02) {
        // A leaf that has not finished opening is still rolled about its midrib: the
        // lamina keeps its width but wraps it into an arc.
        const k = (roll * Math.PI) / Math.max(edge, 1e-4);
        across = Math.sin(k * across) / k;
        out = (1 - Math.cos(k * u * edge)) / k;
      } else {
        out =
          cup * edge * u * u +
          wave * edge * Math.abs(u) ** 2.2 +
          pucker * pinch;
        if (cordate) out += cordate.lift * edge * u * u * basal;
      }
      // One surface carries both sides of the midrib: a groove above, a raised rib below.
      out -= keel * width * Math.exp(-((u / 0.11) ** 2));
      const p = frame.point
        .clone()
        .addScaledVector(side, across)
        .addScaledVector(normal, out);

      // The blade's base is held by the petiole and answers the current with it; the free
      // lamina bends along its own face. Blending the two over the first sixth of the
      // blade keeps the junction watertight while it moves.
      const direction = parent
        ? parent.direction.clone().lerp(normal, attach)
        : normal.clone();
      if (direction.lengthSq() < 1e-6) direction.copy(normal);
      const strand = {
        direction: direction.normalize(),
        tangent: parent
          ? parent.tangent.clone().lerp(frame.tangent, attach).normalize()
          : frame.tangent,
        distance: distance0 + frame.arc,
        compliance: parent
          ? parent.compliance + (compliance - parent.compliance) * attach
          : compliance,
      };

      tint.copy(color);
      const blotch =
        0.93 + 0.14 * noise(v * 4.3 + seed * 7.1, u * 2.1, seed * 3.7);
      const vein =
        0.5 + 0.5 * Math.cos((uvy - Math.abs(j / cols - 0.5) * 0.32) * 155);
      tint.multiplyScalar(
        blotch *
          (0.84 + 0.16 * smoothstep(0, 0.28, v)) *
          (0.9 + 0.1 * vein ** 5),
      );
      if (age > 0.78)
        tint.lerp(brown, smoothstep(0.66, 1, v) * (age - 0.78) * 1.5);
      for (const spot of spots) {
        const d = Math.hypot((v - spot.v) * length, (u - spot.u) * width * 1.3);
        tint.lerp(algae, 0.6 * Math.max(0, 1 - d / spot.r) ** 0.8);
      }
      batch.vertex(
        p,
        [j / cols, uvy],
        tint,
        root,
        strand,
        thin * (1 + 0.5 * Math.abs(u) ** 3),
      );
      if (i < rows && j < cols) {
        // A snail hole is a pinhole whatever the leaf: one or two faces of the mesh.
        const cv = v + 0.5 / rows,
          cu = u + 1 / cols;
        let open = true;
        for (const hole of holes)
          if (
            Math.hypot((cv - hole.v) * length, (cu - hole.u) * width) <
            (0.9 * width) / cols
          )
            open = false;
        if (open) {
          const k = start + i * (cols + 1) + j;
          batch.quad(k, k + 1, k + cols + 1, k + cols + 2);
        }
      }
    }
  }
}

// ---------------------------------------------------------------------------
// Wear. Old leaves carry algae along the margins where flow is slowest, snail pinholes and
// torn edges; young ones are clean.
function wear(age, count) {
  const spots = [],
    holes = [],
    bites = [];
  if (age < 0.45) return { spots, holes, bites };
  const load = (age - 0.45) / 0.55;
  for (let i = 0; i < Math.round(load * count * 2.4); i++)
    spots.push({
      v: between(0.15, 0.97),
      u: (rand() < 0.5 ? -1 : 1) * between(0.5, 1.05),
      r: between(0.02, 0.07),
    });
  if (rand() < load * 0.45) {
    const hole = { v: between(0.3, 0.85), u: between(-0.7, 0.7) };
    holes.push(hole);
    spots.push({ ...hole, r: 0.055 });
  }
  if (rand() < load * 0.6)
    bites.push({
      v: between(0.35, 0.78),
      side: rand() < 0.5 ? -1 : 1,
      depth: between(0.08, 0.22),
      span: between(0.06, 0.15),
    });
  return { spots, holes, bites };
}

// A blade can turn about its midrib but not off it. It rolls to the attitude that gives its
// face the most light: from overhead, plus whatever comes across the open water in front of
// the clump, where nothing shades it. A crowded leaf settles wherever there is room instead.
function faceToLight(lamina, upright, open, jitter) {
  const side = new THREE.Vector3().crossVectors(lamina, upright);
  const preferred = UP.clone().multiplyScalar(0.6).addScaledVector(open, 0.9);
  const theta = Math.atan2(preferred.dot(side), preferred.dot(upright));
  return spun(upright, lamina, theta + jitter);
}

// Rotate `v` about a unit axis.
function spun(v, axis, angle) {
  return v.clone().applyAxisAngle(axis, angle);
}

// ---------------------------------------------------------------------------
// Anubias barteri. A creeping rhizome, never buried, with thick roots gripping whatever it
// lies on and stiff petioles leaving it left and right in a loose spiral. The leaves are
// the darkest in the tank, leathery enough to be opaque, and held nearly flat so the
// overhead light rakes across them.
function anubias(
  batch,
  {
    anchor,
    heading,
    blade: bladeLength,
    leaves,
    surface = (x, z) => groundHeight(x, z),
    faceNormal = UP,
    host = -1,
    hue = 0.33,
    open = vec(0, 0, 1),
  },
) {
  const rocky = host >= 0;
  const root = anchor.clone();
  const radius = 0.062 * bladeLength;
  const step = 0.165 * bladeLength;
  const along = vec(Math.cos(heading), 0, Math.sin(heading));
  const drift = between(-0.5, 0.5);
  const spine = [];
  for (let k = 0; k <= 4; k++) {
    const t = k / 4;
    const p = anchor
      .clone()
      .addScaledVector(along, step * leaves * (t - 0.25))
      .addScaledVector(
        vec(-along.z, 0, along.x),
        drift * step * leaves * t * t,
      );
    p.y = surface(p.x, p.z) + radius * 0.8 + 0.04 * t * bladeLength;
    spine.push(p);
  }
  const rhizomeCurve = new THREE.CatmullRomCurve3(spine);
  const rhizome = stalk(batch, {
    curve: rhizomeCurve,
    root,
    radius,
    rows: lodCount(16, LOD.leaf, 5),
    cols: lodCount(9, LOD.leaf, 4),
    flat: 1.05,
    taper: 0.2,
    knuckle: { count: leaves, depth: 0.14 },
    color: new THREE.Color().setHSL(0.22, 0.26, 0.11),
    tipColor: new THREE.Color().setHSL(0.27, 0.4, 0.14),
    compliance: 0.02,
  });
  const frames = sweptFrames(rhizomeCurve, 24, faceNormal);

  // Thick roots leave the underside of the rhizome and hold onto the sand or, on a rock,
  // flatten out and run down the face.
  for (let k = 0; k < (rocky ? 7 : 5); k++) {
    const t = between(0.06, 0.94);
    const frame = frameAt(frames, t);
    const out = spun(frame.normal, frame.tangent, between(2.0, 4.3));
    const grip = rocky ? between(0.4, 0.85) : between(0.2, 0.4);
    const points = [frame.point.clone().addScaledVector(out, radius * 0.6)];
    let p = points[0].clone();
    let direction = out.clone().addScaledVector(UP, -0.8).normalize();
    for (let s = 1; s <= 3; s++) {
      p = p
        .clone()
        .addScaledVector(direction, (grip * bladeLength) / 3)
        .addScaledVector(UP, -0.03 * bladeLength);
      const floor = surface(p.x, p.z);
      if (rocky) p.y = Math.max(p.y, floor + 0.015);
      else p.y = Math.min(p.y, floor + (s === 3 ? -0.1 : 0.02) * bladeLength);
      points.push(p.clone());
      direction = direction.addScaledVector(UP, -0.45).normalize();
    }
    stalk(batch, {
      curve: new THREE.CatmullRomCurve3(points),
      root,
      radius: radius * between(0.22, 0.34),
      rows: lodCount(6, LOD.leaf, 4),
      cols: lodCount(5, LOD.leaf, 3),
      flat: rocky ? 2.1 : 1.1,
      taper: 0.45,
      color: new THREE.Color().setHSL(0.1, 0.2, 0.19),
      tipColor: new THREE.Color().setHSL(0.09, 0.17, 0.11),
      compliance: 0,
      attached: { direction: UP, tangent: UP, distance: 0, compliance: 0 },
    });
  }

  for (let k = 0; k < leaves; k++) {
    const t = clamp01((k + 0.55) / leaves);
    const age = 1 - t;
    const frame = frameAt(frames, t);
    const young = age < 0.22;
    const size =
      bladeLength * (young ? between(0.45, 0.62) : between(0.82, 1.06));
    const stalkLength =
      size * (young ? between(0.4, 0.75) : between(0.6, 1.15));
    // Leaves alternate to either side of the creeping rhizome, the angle drifting round it
    // so the clump fills in rather than forming a flat row. A leaf that would grow into a
    // rock finds its way round it instead.
    let emerge = null;
    let outward = null;
    for (let attempt = 0; attempt < 4 && !outward; attempt++) {
      const swing =
        (k % 2 ? 1 : -1) *
          (between(0.3, rocky ? 0.75 : 1.1) + attempt * (rocky ? 0.4 : 0.8)) +
        Math.sin(k * 1.9) * 0.3;
      emerge = spun(frame.normal, frame.tangent, swing).normalize();
      const flat = emerge
        .clone()
        .addScaledVector(UP, -emerge.dot(UP))
        .normalize();
      if (flat.lengthSq() < 0.05)
        flat.crossVectors(frame.tangent, UP).multiplyScalar(Math.sign(swing));
      // An old leaf has arched further over, so its blade is carried lower and further out.
      const lift = between(0.42, 0.85) + 0.45 * (1 - age) ** 1.4;
      const candidate = flat
        .clone()
        .multiplyScalar(Math.cos(lift))
        .addScaledVector(UP, Math.sin(lift))
        .normalize();
      const stem = frame.point
        .clone()
        .addScaledVector(emerge, stalkLength * 0.3)
        .addScaledVector(candidate, stalkLength * 0.78);
      const mid = stem.clone().addScaledVector(candidate, size * 0.45);
      const tip = stem.clone().addScaledVector(candidate, size * 0.9);
      if (
        attempt === 3 ||
        (!insideRock(stem, host) &&
          !insideRock(mid, host) &&
          !insideRock(tip, host))
      )
        outward = candidate;
    }
    const node = frame.point.clone().addScaledVector(emerge, radius * 0.7);
    const petiole = stalk(batch, {
      curve: new THREE.CubicBezierCurve3(
        node,
        node.clone().addScaledVector(emerge, stalkLength * 0.44),
        node
          .clone()
          .addScaledVector(emerge, stalkLength * 0.34)
          .addScaledVector(outward, stalkLength * 0.42),
        node
          .clone()
          .addScaledVector(emerge, stalkLength * 0.3)
          .addScaledVector(outward, stalkLength * 0.78),
      ),
      root,
      radius: 0.026 * size,
      rows: lodCount(9, LOD.leaf, 4),
      cols: lodCount(7, LOD.leaf, 3),
      flat: 1.25,
      groove: 0.45,
      sheath: 0.7,
      taper: 0.14,
      color: new THREE.Color().setHSL(
        hue - 0.04,
        between(0.36, 0.5),
        between(0.085, 0.12),
      ),
      compliance: 0.16,
      distance0: rhizome.length * t,
    });
    // The lamina does not carry straight on from the petiole: it is hinged away from it,
    // more so the more steeply the petiole is held, which is how a leaf on an upright stalk
    // still turns its face to the light.
    const hinge = new THREE.Vector3()
      .crossVectors(UP, petiole.tangent)
      .normalize();
    const lamina = spun(
      petiole.tangent,
      hinge,
      0.3 + 0.55 * Math.max(0, petiole.tangent.y),
    );
    const upright = UP.clone()
      .addScaledVector(lamina, -UP.dot(lamina))
      .normalize();
    const face =
      rand() < 0.3
        ? spun(upright, lamina, between(-1.5, 1.5))
        : faceToLight(lamina, upright, open, between(-0.8, 0.8));
    const canopy =
      0.66 +
      0.34 *
        smoothstep(
          0.25,
          1.9,
          petiole.tip.y - groundHeight(petiole.tip.x, petiole.tip.z),
        );
    const shade = (0.84 + 0.3 * t) * canopy;
    const damage = wear(age, young ? 0 : 3);
    bladeSurface(batch, {
      base: petiole.tip,
      tangent: lamina,
      face,
      length: size,
      width: size * between(0.44, 0.5),
      outline: OUTLINES.anubias,
      root,
      color: new THREE.Color().setHSL(
        hue + between(-0.03, 0.035) - (young ? 0.035 : 0),
        between(0.55, 0.78),
        (young ? between(0.14, 0.19) : between(0.07, 0.15)) * shade,
      ),
      distance0: petiole.strand.distance,
      parent: petiole.strand,
      compliance: 0.27,
      thin: young ? 0.28 : 0.1,
      ...density(size),
      veinPairs: 12,
      arch: between(0.03, 0.1),
      droop: between(0.03, 0.12),
      sweep: between(-0.12, 0.12),
      cordate: { reach: between(0.12, 0.18), span: 0.28, lift: 0.25 },
      cup: between(0.26, 0.46),
      keel: 0.02,
      twist: between(-0.1, 0.1),
      undulate: between(0.02, 0.05),
      undulateWaves: 2,
      bullate: 0.03,
      furl: young && rand() < 0.6 ? between(0.5, 0.85) : 0,
      age,
      seed: rand(),
      ...damage,
    });
  }
}

// The roots a rosette shows where it meets the sand: pale, creeping just under the surface
// so only their backs are visible, the way a crown's anchor roots sit in fine gravel.
function crownRoots(batch, { x, z, root, blade: bladeLength, count }) {
  for (let k = 0; k < count; k++) {
    const a = between(0, TAU);
    const reach = between(0.3, 0.62) * bladeLength;
    const point = (f, sink) => {
      const px = x + Math.cos(a) * reach * f,
        pz = z + Math.sin(a) * reach * f;
      return vec(px, groundHeight(px, pz) - sink * bladeLength, pz);
    };
    stalk(batch, {
      curve: new THREE.CatmullRomCurve3([
        point(0, 0.02),
        point(0.45, 0.035),
        point(0.8, 0.06),
        point(1, 0.14),
      ]),
      root,
      radius: 0.016 * bladeLength,
      rows: lodCount(6, LOD.leaf, 4),
      cols: lodCount(5, LOD.leaf, 3),
      flat: 1.15,
      taper: 0.45,
      color: new THREE.Color().setHSL(0.11, 0.16, 0.2),
      tipColor: new THREE.Color().setHSL(0.1, 0.14, 0.11),
      compliance: 0,
      attached: { direction: UP, tangent: UP, distance: 0, compliance: 0 },
    });
  }
}

// ---------------------------------------------------------------------------
// Echinodorus. A rosette on a short crown at the sand, broad lanceolate blades folded along
// the midrib and carried up and out on ribbed petioles; the youngest leaves stand almost
// upright in the middle, the oldest lie nearly flat around the outside.
function echinodorus(
  batch,
  { x, z, blade: bladeLength, leaves, hue = 0.26, open = vec(0, 0, 1) },
) {
  const ground = groundHeight(x, z);
  const root = vec(x, ground - 0.04, z);
  const crownTop = vec(x, ground + 0.1 * bladeLength, z);
  stalk(batch, {
    curve: new THREE.CatmullRomCurve3([
      vec(x, ground - 0.16 * bladeLength, z),
      crownTop.clone().lerp(root, 0.45),
      crownTop,
    ]),
    root,
    radius: 0.062 * bladeLength,
    rows: lodCount(5, LOD.leaf, 4),
    cols: lodCount(8, LOD.leaf, 3),
    flat: 1,
    taper: 0.3,
    color: new THREE.Color().setHSL(0.1, 0.28, 0.1),
    tipColor: new THREE.Color().setHSL(0.19, 0.34, 0.09),
    compliance: 0.03,
  });
  crownRoots(batch, { x, z, root, blade: bladeLength, count: 3 });
  for (let k = 0; k < leaves; k++) {
    const t = (k + 0.5) / leaves;
    const age = 1 - t;
    const angle = k * 2.39996 + between(-0.35, 0.35);
    // Older leaves sit lower on the crown and lean out much further.
    const lift = between(1.32, 1.5) - 0.95 * age * between(0.7, 1.15);
    const flat = vec(Math.cos(angle), 0, Math.sin(angle));
    const outward = flat
      .clone()
      .multiplyScalar(Math.cos(lift))
      .addScaledVector(UP, Math.sin(lift))
      .normalize();
    const young = age < 0.18;
    const size =
      bladeLength * (young ? between(0.45, 0.62) : between(0.8, 1.08));
    const stalkLength = size * between(0.4, 0.68);
    const node = vec(
      x + Math.cos(angle) * 0.06 * bladeLength,
      ground + between(0.02, 0.12) * bladeLength,
      z + Math.sin(angle) * 0.06 * bladeLength,
    );
    const rise = UP.clone()
      .multiplyScalar(2.2)
      .addScaledVector(flat, 0.5)
      .normalize();
    const petiole = stalk(batch, {
      curve: new THREE.CubicBezierCurve3(
        node,
        node.clone().addScaledVector(rise, stalkLength * 0.5),
        node
          .clone()
          .addScaledVector(rise, stalkLength * 0.55)
          .addScaledVector(outward, stalkLength * 0.34),
        node
          .clone()
          .addScaledVector(rise, stalkLength * 0.42)
          .addScaledVector(outward, stalkLength * 0.72),
      ),
      root,
      radius: 0.023 * size,
      rows: lodCount(9, LOD.leaf, 4),
      cols: lodCount(7, LOD.leaf, 3),
      flat: 1.4,
      groove: 0.55,
      sheath: 0.85,
      taper: 0.1,
      color: new THREE.Color().setHSL(
        hue - 0.045,
        between(0.38, 0.52),
        between(0.075, 0.115),
      ),
      compliance: 0.26,
    });
    const hinge = new THREE.Vector3()
      .crossVectors(UP, petiole.tangent)
      .normalize();
    const lamina = spun(
      petiole.tangent,
      hinge,
      0.24 + 0.5 * Math.max(0, petiole.tangent.y),
    );
    const upright = UP.clone()
      .addScaledVector(lamina, -UP.dot(lamina))
      .normalize();
    const face =
      rand() < 0.14
        ? spun(upright, lamina, between(-1.5, 1.5))
        : faceToLight(lamina, upright, open, between(-0.5, 0.5));
    const damage = wear(age * 0.85, 2);
    bladeSurface(batch, {
      base: petiole.tip,
      tangent: lamina,
      face,
      length: size,
      width: size * between(0.15, 0.19),
      outline: OUTLINES.echinodorus,
      root,
      color: new THREE.Color().setHSL(
        hue + between(-0.02, 0.03) - (young ? 0.02 : 0),
        between(0.6, 0.8),
        (young ? between(0.17, 0.23) : between(0.11, 0.19)) * (0.85 + 0.3 * t),
      ),
      distance0: petiole.strand.distance,
      parent: petiole.strand,
      compliance: 0.4,
      thin: 0.32,
      ...density(size * 0.85),
      veinPairs: 6,
      arch: between(0.04, 0.12),
      droop: between(0.12, 0.3),
      sweep: between(-0.15, 0.15),
      cup: between(0.22, 0.42),
      keel: 0.03,
      twist: between(-0.25, 0.25),
      undulate: between(0.05, 0.12),
      undulateWaves: 2,
      bullate: 0.02,
      furl: young && rand() < 0.5 ? between(0.45, 0.8) : 0,
      age,
      seed: rand(),
      ...damage,
    });
  }
}

// ---------------------------------------------------------------------------
// Cryptocoryne wendtii. A low rosette of olive to bronze lanceolate leaves on slender
// petioles, the margins strongly waved and the lamina puckered between its veins.
function crypt(
  batch,
  { x, z, blade: bladeLength, leaves, hue = 0.16, open = vec(0, 0, 1) },
) {
  const ground = groundHeight(x, z);
  const root = vec(x, ground - 0.05, z);
  const bronze = between(0, 1);
  stalk(batch, {
    curve: new THREE.CatmullRomCurve3([
      vec(x, ground - 0.2 * bladeLength, z),
      vec(x, ground - 0.02 * bladeLength, z),
      vec(x, ground + 0.1 * bladeLength, z),
    ]),
    root,
    radius: 0.055 * bladeLength,
    rows: lodCount(5, LOD.leaf, 4),
    cols: lodCount(7, LOD.leaf, 3),
    flat: 1,
    taper: 0.4,
    color: new THREE.Color().setHSL(0.09, 0.3, 0.09),
    tipColor: new THREE.Color().setHSL(0.14, 0.36, 0.085),
    compliance: 0.03,
  });
  crownRoots(batch, { x, z, root, blade: bladeLength, count: 2 });
  for (let k = 0; k < leaves; k++) {
    const t = (k + 0.5) / leaves;
    const age = 1 - t;
    const angle = k * 2.39996 + between(-0.4, 0.4);
    const lift = between(1.15, 1.4) - 1.0 * age * between(0.75, 1.2);
    const flat = vec(Math.cos(angle), 0, Math.sin(angle));
    const outward = flat
      .clone()
      .multiplyScalar(Math.cos(lift))
      .addScaledVector(UP, Math.sin(lift))
      .normalize();
    const young = age < 0.2;
    const size =
      bladeLength * (young ? between(0.4, 0.58) : between(0.78, 1.06));
    const stalkLength = size * between(0.42, 0.72);
    const node = vec(
      x + Math.cos(angle) * 0.05 * bladeLength,
      ground + between(0.01, 0.1) * bladeLength,
      z + Math.sin(angle) * 0.05 * bladeLength,
    );
    const rise = UP.clone()
      .multiplyScalar(2)
      .addScaledVector(flat, 0.6)
      .normalize();
    const petiole = stalk(batch, {
      curve: new THREE.CubicBezierCurve3(
        node,
        node.clone().addScaledVector(rise, stalkLength * 0.5),
        node
          .clone()
          .addScaledVector(rise, stalkLength * 0.52)
          .addScaledVector(outward, stalkLength * 0.36),
        node
          .clone()
          .addScaledVector(rise, stalkLength * 0.38)
          .addScaledVector(outward, stalkLength * 0.76),
      ),
      root,
      radius: 0.021 * size,
      rows: lodCount(8, LOD.leaf, 4),
      cols: lodCount(6, LOD.leaf, 3),
      flat: 1.15,
      groove: 0.35,
      sheath: 0.7,
      taper: 0.12,
      color: new THREE.Color().setHSL(
        0.115,
        between(0.3, 0.46),
        between(0.08, 0.115),
      ),
      compliance: 0.32,
    });
    const hinge = new THREE.Vector3()
      .crossVectors(UP, petiole.tangent)
      .normalize();

 * background. Below about seven pixels none of that can be resolved, so it

 *     pressure falls, and wobbles harder the bigger a bubble is;
 *   - the pump: fine white micro-bubbles it entrains and throws across the tank;
 *   - pearling: single bubbles that form on leaves and let go now and then.
 *

 * hides a bubble behind it, tinted by the same per-channel absorption the water

attribute vec3 aCenter;
attribute vec4 aData;            // x radius, y seed, z fade, w kind
uniform float uPxScale;          // pixels per world unit at distance 1
varying vec2 vUv;
varying vec4 vData;
varying float vDepth;
varying float vPx;
void main() {
  vec4 mv = modelViewMatrix * vec4(aCenter, 1.0);
  float d = max(-mv.z, 0.1);

  // does not fade, it flickers

varying vec2 vUv;
varying vec4 vData;
varying float vDepth;
varying float vPx;

  float edge = smoothstep(0.88, 0.955, r) * (1.0 - smoothstep(0.955, 1.0, r));

  vec2 g2 = vUv - vec2(0.42, -0.36);

        if (q > -1e8) { sum += q; c++; }
      }
      if (c >= 3) f[k] = sum / c;
    }
  }
  return {
    at(x, z) {
      const fx = (x - x0) / CELL, fz = (z - z0) / CELL, ix = Math.floor(fx), iz = Math.floor(fz);
      if (ix < 0 || iz < 0 || ix >= nx - 1 || iz >= nz - 1) return null;
      const a = f[iz * nx + ix], b = f[iz * nx + ix + 1], c = f[(iz + 1) * nx + ix], d = f[(iz + 1) * nx + ix + 1];
      if (a < -1e8 || b < -1e8 || c < -1e8 || d < -1e8) return null;
      const tx = fx - ix, tz = fz - iz;
      return (a * (1 - tx) + b * tx) * (1 - tz) + (c * (1 - tx) + d * tx) * tz;
    },
  };
}

function makeShrimp(geo, mats) {
  const root = new THREE.Group(); // where it stands, which way it faces, and how the surface slopes
  root.rotation.order = 'YZX';
  const body = new THREE.Group(); // dips its head, and takes the tail flick
  root.add(body);
  const add = (parent, geometry, material, x, y, z, sx = 1, sy = 1, sz = 1) => {
    const mesh = new THREE.Mesh(geometry, material);
    mesh.position.set(x, y, z);
    mesh.scale.set(sx, sy, sz);
    parent.add(mesh);
    return mesh;
  };

  // head and thorax: the carapace, the horn between the eyes, the eyes, the gut showing through
  add(body, geo.sphere, mats.body, 0.2, 0.22, 0, 0.21, 0.12, 0.12);
  const horn = add(body, geo.horn, mats.body, 0.4, 0.27, 0);
  horn.rotation.z = 0.2;
  for (const s of [1, -1]) add(body, geo.sphere, mats.eye, 0.4, 0.285, 0.09 * s, 0.03, 0.03, 0.03);
  add(body, geo.gut, mats.gut, 0.12, 0.22, 0, 0.3, 0.9, 0.9);

  // the abdomen: six segments in a chain, each bending a little, so the body can curve and curl;
  // the first five carry a pair of swimmerets underneath
  const abdomen = [];
  const pleopods = [];
  const segLen = 0.1;
  let parent = body;
  for (let i = 0; i < 6; i++) {
    const joint = new THREE.Group();
    joint.position.set(i === 0 ? 0.04 : -segLen, i === 0 ? 0.2 : 0, 0);
    parent.add(joint);
    add(joint, geo.sphere, mats.body, -segLen / 2, 0, 0, segLen * 0.62, 0.095 - i * 0.008, 0.09 - i * 0.008);
    add(joint, geo.gut, mats.gut, -segLen / 2, 0.012, 0, segLen * 1.05, 0.7, 0.7);
    if (i < 5) {
      for (const s of [1, -1]) {
        const stalk = new THREE.Group();
        stalk.position.set(-segLen / 2, -0.07, 0.045 * s);
        joint.add(stalk);
        add(stalk, geo.sphere, mats.leg, 0, -0.025, 0, 0.012, 0.03, 0.014);
        pleopods.push({ stalk, i, s });
      }
    }
    abdomen.push(joint);
    parent = joint;
  }
  // the tail fan: a middle plate and two side plates, with the small specks it carries
  const tail = new THREE.Group();
  tail.position.set(-segLen, 0, 0);
  parent.add(tail);
  add(tail, geo.sphere, mats.body, -0.06, 0, 0, 0.09, 0.012, 0.03);
  for (const s of [1, -1]) {
    const plate = add(tail, geo.sphere, mats.body, -0.055, 0, 0.045 * s, 0.075, 0.01, 0.035);
    plate.rotation.y = 0.35 * s;
    add(tail, geo.sphere, mats.speck, -0.09, 0.012, 0.028 * s, 0.012, 0.012, 0.012);
  }

  // five pairs of legs; the front two end in claws and do the picking
  const legs = [];
  const attach = [0.34, 0.28, 0.21, 0.14, 0.07];
  for (let i = 0; i < 5; i++) {
    for (const s of [1, -1]) {
      const g = new THREE.Group();
      g.position.set(attach[i], 0.15, 0.06 * s);
      body.add(g);
      const baseYaw = -s * (Math.PI / 2 - (0.55 - i * 0.28)); // out to the side: the front ones forward of it, the back ones behind
      g.rotation.y = baseYaw;
      const upper = new THREE.Group();
      upper.rotation.z = -0.55;
      g.add(upper);
      add(upper, geo.leg1, mats.leg, 0, 0, 0);
      const lower = new THREE.Group();
      lower.position.set(0.13, 0, 0);
      lower.rotation.z = -0.8;
      upper.add(lower);
      add(lower, geo.leg2, mats.leg, 0, 0, 0);
      if (i < 2) add(lower, geo.sphere, mats.leg, 0.09, 0, 0, 0.022, 0.013, 0.013);
      legs.push({ g, upper, lower, i, s, baseYaw });
    }
  }

  // two long antennae, each a chain that can sweep, and two short antennules
  const antennae = [];
  for (const s of [1, -1]) {
    const base = new THREE.Group();
    base.position.set(0.4, 0.24, 0.05 * s);
    body.add(base);
    const joints = [];
    let p = base;
    for (let i = 0; i < 5; i++) {
      const j = new THREE.Group();
      if (i > 0) j.position.x = 0.2;
      p.add(j);
      add(j, geo.antenna, mats.antenna, 0, 0, 0);
      joints.push(j);
      p = j;
    }
    antennae.push({ s, base, joints });
    const short = add(body, geo.antennule, mats.antenna, 0.43, 0.25, 0.03 * s);
    short.rotation.y = -0.35 * s;
  }

  return { root, body, abdomen, legs, antennae, pleopods };
}

function createShrimp(scene, { count = 2, ground, obstacles = [] } = {}) {
  const geo = {
    sphere: new THREE.SphereGeometry(1, 14, 10),
    horn: (() => { const g = new THREE.ConeGeometry(0.03, 0.2, 6); g.rotateZ(-Math.PI / 2); g.translate(0.1, 0, 0); return g; })(),
    gut: (() => { const g = new THREE.CylinderGeometry(0.02, 0.02, 1, 6); g.rotateZ(Math.PI / 2); return g; })(),
    leg1: tube(0.13, 0.011, 0.008),
    leg2: tube(0.09, 0.008, 0.005),
    antenna: tube(0.2, 0.011, 0.007, 5),   // thick enough to show: the real ones are finer, but sub-pixel tubes break into dots
    antennule: tube(0.22, 0.009, 0.005, 5),
  };
  const mats = {
    // mostly see-through, as a ghost shrimp is, with a warm pink-tan so they show against the sand;
    // the gut and the eyes are opaque, so they show
    body: material({ color: '#f29f84', roughness: 0.35, metalness: 0, transparent: true, opacity: 0.78, depthWrite: false }, 'body'),
    leg: material({ color: '#e89a80', roughness: 0.5, metalness: 0, transparent: true, opacity: 0.9, depthWrite: false }, 'leg'),
    antenna: material({ color: '#e09b85', roughness: 0.5, metalness: 0, transparent: true, opacity: 0.9, depthWrite: false }, 'antenna'),
    gut: material({ color: '#7a4a32', roughness: 0.7, metalness: 0 }, 'gut'),
    eye: material({ color: '#14110c', roughness: 0.25, metalness: 0 }, 'eye'),
    speck: material({ color: '#d98a4a', roughness: 0.6, metalness: 0 }, 'speck'),
  };

  const clearOfRock = (x, z, margin) => obstacles.every((o) => Math.hypot(x - o.center.x, z - o.center.z) > o.radius + margin);
  // the low stones, which they can climb; each one's surface grid is built the first time it is needed
  const stones = obstacles.filter((o) => o.mesh && o.mesh.scale.y <= 0.6);
  const gridOf = (o) => (o.grid ??= buildGrid(o.mesh));
  // the height they stand at: the sand, or the stone they are on, if it is higher there
  function heightAt(s, x, z) {
    const sand = ground(x, z);
    if (!s.rock) return sand;
    const y = gridOf(s.rock).at(x, z);
    return y !== null && y > sand ? y : sand;
  }

  const list = [];
  for (let i = 0; i < count; i++) {
    let x, z, tries = 0;
    do {
      x = rand(area.minX + 0.4, area.maxX - 0.4);
      z = rand(area.minZ + 0.2, area.maxZ - 0.2);
      tries++;
    } while (tries < 80 && !clearOfRock(x, z, 0.7));
    const model = makeShrimp(geo, mats);
    const size = rand(0.45, 0.55);
    model.root.scale.setScalar(size);
    scene.add(model.root);
    Object.assign(model, {
      size, x, z,
      heading: rand(-Math.PI, Math.PI),
      cruise: rand(0.09, 0.15),
      turn: rand(-0.3, 0.3),
      turnTimer: rand(2, 5),
      phase: rand(0, 6.28),
      stride: rand(0, 6.28),
      state: i % 2 === 0 ? 'walk' : 'forage',
      timer: rand(3, 9),
      moving: 0,       // 0 = standing, 1 = going: eases, so the legs do not snap
      flickT: 0,
      lift: 0,         // the flick's little rise
      alt: 0,          // height above the surface while swimming
      altVel: 0,
      rock: null,      // the stone it is on, climbing, or leaving
      tx: 0, tz: 0, swimAlt: 0, swimSpeed: 0.5,
      slow: 1,
      swimming: 0,     // 0 = on the surface, 1 = swimming: eases, so the legs fold and unfold smoothly
      flicks: 0, swims: 0, climbs: 0,
    });
    list.push(model);
  }

  // ---- choosing what to do next ----
  function startSwim(s) {
    let tx, tz, tries = 0;
    do {
      const a = rand(0, Math.PI * 2), d = rand(1.5, 3.5);
      tx = clamp(s.x + Math.cos(a) * d, area.minX + 0.3, area.maxX - 0.3);
      tz = clamp(s.z + Math.sin(a) * d * 0.6, area.minZ + 0.2, area.maxZ - 0.2);
      tries++;
    } while (tries < 20 && !clearOfRock(tx, tz, 0.6));
    Object.assign(s, { state: 'swim', tx, tz, swimAlt: rand(0.45, 1.5), swimSpeed: rand(0.45, 0.7), timer: 16, rock: null });
    s.swims++;
  }
  // no other stone lies across the straight line from the shrimp to this one: with one in the way,
  // the pull toward the target and the push away from the obstacle cancel, and it gets stuck
  function pathClear(s, o) {
    const dx = o.center.x - s.x, dz = o.center.z - s.z, len2 = dx * dx + dz * dz || 1;
    return obstacles.every((q) => {
      if (q === o) return true;
      const t = clamp(((q.center.x - s.x) * dx + (q.center.z - s.z) * dz) / len2, 0, 1);
      return Math.hypot(q.center.x - (s.x + t * dx), q.center.z - (s.z + t * dz)) > q.radius * 0.85 + 0.1;
    });
  }
  function startClimb(s) {
    const near = stones.filter((o) => o.center.x > area.minX - 0.2 && o.center.x < area.maxX + 0.2 && o.center.z > area.minZ - 0.2 && o.center.z < area.maxZ + 0.6 && pathClear(s, o));
    if (!near.length) return false;
    near.sort((a, b) => Math.hypot(a.center.x - s.x, a.center.z - s.z) - Math.hypot(b.center.x - s.x, b.center.z - s.z));
    s.rock = near[Math.min(near.length - 1, Math.floor(Math.random() * Math.min(3, near.length)))];
    s.state = 'climb';
    // time enough to get there at the pace it walks, and a margin; a stone far off is a long way
    s.timer = 12 + Math.hypot(s.rock.center.x - s.x, s.rock.center.z - s.z) / 0.07;
    s.climbs++;
    return true;
  }
  function nextAfterWalk(s) {
    const r = Math.random();
    if (r < 0.05) { s.state = 'flick'; s.flickT = 0; s.flicks++; }
    else if (r < 0.17) startSwim(s);
    else if (r < 0.30 && startClimb(s)) { /* on its way up */ }
    else if (r < 0.62) { s.state = 'forage'; s.timer = rand(3, 7); }
    else if (r < 0.76) { s.state = 'groom'; s.timer = rand(2, 4); }
    else { s.state = 'walk'; s.timer = rand(4, 11); s.turn = rand(-0.3, 0.3); }
  }
  function nextAfterForage(s) {
    const r = Math.random();
    if (r < 0.55) { s.state = 'walk'; s.timer = rand(4, 11); s.turn = rand(-0.3, 0.3); }
    else if (r < 0.65) startSwim(s);
    else if (r < 0.75 && startClimb(s)) { /* on its way up */ }
    else if (r < 0.9) { s.state = 'groom'; s.timer = rand(2, 4); }
    else s.timer = rand(2, 5);
  }

  // steer away from the stones (all but the one it means to be on), slowing as it gets close
  function steerAway(s, except) {
    let steer = 0;
    s.nearest = 9;
    for (const o of obstacles) {
      if (o === except) continue;
      const dx = s.x - o.center.x, dz = s.z - o.center.z;
      const surface = Math.hypot(dx, dz) - o.radius - 0.3 * s.size;
      if (surface < s.nearest) s.nearest = surface;
      if (surface < 0.7) {
        const away = Math.atan2(-dz, dx);
        steer += clamp(wrapPI(away - s.heading), -1, 1) * (0.7 - surface) * 3.2;
        if (surface < 0.2) s.slow = Math.min(s.slow, Math.max(0.2, surface / 0.2));
      }
    }
    return steer;
  }
  function steerInside(s) {
    const margin = 0.35;
    if (s.x < area.minX + margin || s.x > area.maxX - margin || s.z < area.minZ + margin || s.z > area.maxZ - margin) {
      const toCentre = Math.atan2(-((area.minZ + area.maxZ) / 2 - s.z), (area.minX + area.maxX) / 2 - s.x);
      return clamp(wrapPI(toCentre - s.heading), -1, 1) * 1.4;
    }
    return 0;
  }

  function update(dt, time) {
    for (const s of list) {
      s.timer -= dt;
      s.slow = 1;
      let speed = 0;

      if (s.state === 'walk') {
        speed = s.cruise;
        s.turnTimer -= dt;
        if (s.turnTimer <= 0) { s.turn = rand(-0.35, 0.35); s.turnTimer = rand(2, 5); }
        s.heading += clamp(s.turn + steerAway(s, null) + steerInside(s), -1.3, 1.3) * dt;
        if (s.timer <= 0) nextAfterWalk(s);
      } else if (s.state === 'forage') {
        if (s.timer <= 0) nextAfterForage(s);
      } else if (s.state === 'groom') {
        if (s.timer <= 0) { s.state = 'walk'; s.timer = rand(4, 11); }
      } else if (s.state === 'flick') {
        s.flickT += dt;
        // a quick backward shot that dies away, with a little rise: the tail curls under
        const back = 1.5 * Math.exp(-s.flickT / 0.18);
        const nx = s.x - Math.cos(s.heading) * back * dt, nz = s.z + Math.sin(s.heading) * back * dt;
        const blocked = !clearOfRock(nx, nz, 0.3 * s.size) || nx < area.minX || nx > area.maxX || nz < area.minZ || nz > area.maxZ;
        if (!blocked) { s.x = nx; s.z = nz; }
        s.lift = 0.22 * Math.sin(Math.PI * clamp(s.flickT / 0.5, 0, 1));
        if (s.flickT > 0.6) { s.state = 'forage'; s.timer = rand(1.5, 3); s.lift = 0; }
      } else if (s.state === 'swim') {
        // lift off, glide toward the target steering round the stones, and come down on it
        const dx = s.tx - s.x, dz = s.tz - s.z, dist = Math.hypot(dx, dz);
        const want = Math.atan2(-dz, dx);
        s.heading += clamp(clamp(wrapPI(want - s.heading), -1, 1) * 2 + steerAway(s, null), -1.8, 1.8) * dt;
        speed = s.swimSpeed * (dist > 0.4 ? 1 : 0.2 + dist / 0.5);
        if (s.timer <= 0) { s.tx = s.x; s.tz = s.z; }          // out of time: come down where it is
        const altTarget = dist > 1.1 ? s.swimAlt : 0;
        const rate = altTarget > s.alt ? 1.1 : 0.9;
        const before = s.alt;
        s.alt += clamp(altTarget - s.alt, -rate * dt, rate * dt);
        s.altVel = (s.alt - before) / Math.max(dt, 1e-4);
        if (dist < 0.35 && s.alt < 0.03) { s.alt = 0; s.altVel = 0; s.state = 'forage'; s.timer = rand(2, 5); }
      } else if (s.state === 'climb') {
        // walk up to the top of the stone
        const o = s.rock;
        const dx = o.center.x - s.x, dz = o.center.z - s.z, dist = Math.hypot(dx, dz);
        const want = Math.atan2(-dz, dx);
        speed = s.cruise * 1.3;   // it is going somewhere, so a little brisker than a stroll
        const away = steerAway(s, o);
        // close to some other stone, it stops being drawn toward its target and slides clear first
        const pull = clamp((s.nearest - 0.05) / 0.4, 0, 1);
        s.heading += clamp(clamp(wrapPI(want - s.heading), -1, 1) * 2.2 * pull + away, -1.5, 1.5) * dt;
        if (dist < 0.3 * Math.min(o.mesh.scale.x, o.mesh.scale.z) + 0.1) { s.state = 'perch'; s.timer = rand(6, 14); }
        else if (s.timer <= 0) { s.rock = null; s.state = 'walk'; s.timer = rand(4, 8); }
      } else if (s.state === 'perch') {
        // sit on the stone and pick at it, then turn and walk off
        if (s.timer <= 0) {
          const o = s.rock;
          s.heading = Math.atan2(-(s.z - o.center.z), s.x - o.center.x) + rand(-0.6, 0.6);
          s.state = 'descend';
          s.timer = 14;
        }
      } else if (s.state === 'descend') {
        const o = s.rock;
        speed = s.cruise;
        s.heading += clamp(steerAway(s, o) * 0.6, -1, 1) * dt;
        const d = Math.hypot(s.x - o.center.x, s.z - o.center.z);
        if (d > Math.max(o.mesh.scale.x, o.mesh.scale.z) * 1.1 + 0.1 || s.timer <= 0) { s.rock = null; s.state = 'walk'; s.timer = rand(4, 9); }
      }
      speed *= s.slow;

      // move: forward along the heading, never by assignment
      const swimmingNow = s.state === 'swim';
      s.moving += ((speed > 0 ? 1 : 0) - s.moving) * Math.min(1, dt * 6);
      s.swimming += ((swimmingNow ? 1 : 0) - s.swimming) * Math.min(1, dt * 5);
      if (speed > 0) {
        const gait = swimmingNow ? 1 : 0.88 + 0.12 * Math.sin(time * 2 + s.phase);   // a gentle surge, not a stutter
        s.x += Math.cos(s.heading) * speed * gait * dt;
        s.z -= Math.sin(s.heading) * speed * gait * dt;
        const pad = s.rock ? 0.8 : 0;   // a stone at the edge of the sand may be climbed
        s.x = clamp(s.x, area.minX - pad, area.maxX + pad);
        s.z = clamp(s.z, area.minZ - pad, area.maxZ + pad);
        if (!swimmingNow) s.stride += dt * (9 + speed * 30);   // unhurried steps
      }

      // stand on the surface (sand or stone), and tilt to follow it; both are eased, and the
      // tilt halved on the sand, so it glides over the ripples and does not rock with each one
      const ahead = 0.15 * s.size * 2;
      const hA = heightAt(s, s.x + Math.cos(s.heading) * ahead, s.z - Math.sin(s.heading) * ahead);
      const hB = heightAt(s, s.x - Math.cos(s.heading) * ahead, s.z + Math.sin(s.heading) * ahead);
      const gy = heightAt(s, s.x, s.z);
      const slopeTilt = clamp((s.rock ? 0.9 : 0.5) * Math.atan2(hA - hB, 2 * ahead), -0.7, 0.7);
      // swimming, it pitches up as it climbs and down as it descends
      const pitchTarget = swimmingNow ? clamp(s.altVel * 0.4, -0.4, 0.4) + 0.04 : slopeTilt;
      if (s.gy === undefined) { s.gy = gy; s.pitch = pitchTarget; }
      const ease = Math.min(1, dt * (s.rock ? 8 : 4));
      // the height follows the surface, but can only rise or fall so fast: the edge of a stone is
      // nearly a cliff, and a shrimp scrambles up it and does not hop
      const maxMove = 1.1 * dt;
      s.gy += clamp((gy - s.gy) * ease, -maxMove, maxMove);
      s.pitch += (pitchTarget - s.pitch) * Math.min(1, dt * 4);
      s.root.position.set(s.x, s.gy + s.alt + s.lift * s.size, s.z);
      s.root.rotation.y = s.heading;
      s.root.rotation.z = s.pitch;

      // legs: alternate sides and alternate legs, the foot lifting as it swings forward; folded
      // back and tucked up when swimming
      const picking = s.state === 'forage' || (s.state === 'perch' && Math.sin(time * 0.5 + s.phase) < 0.5);
      const grooming = s.state === 'groom' || (s.state === 'perch' && !picking);
      const fold = s.swimming;
      for (const l of s.legs) {
        const phi = s.stride + (l.i % 2 ? Math.PI : 0) + (l.s > 0 ? 0 : Math.PI);
        let swing = 0.26 * Math.sin(phi) * s.moving * (1 - fold);
        let liftFoot = Math.max(0, Math.cos(phi)) * 0.4 * s.moving * (1 - fold);
        let upperTilt = -0.55;
        if (l.i < 2 && picking) {
          // the front claws pick at the surface, one then the other
          const pick = Math.sin(time * 26 + l.s * 1.9 + l.i * 0.8);
          swing = 0.2 * pick;
          liftFoot = 0.55 * Math.max(0, pick);
        } else if (l.i < 2 && grooming) {
          // they reach up to draw the antennae through
          upperTilt = -0.55 + 0.9 + 0.2 * Math.sin(time * 9 + l.s);
          liftFoot = 0.4;
        }
        // swimming: the legs sweep back along the body and fold up
        l.g.rotation.y = l.baseYaw + l.s * swing - l.s * fold * (l.i < 2 ? -0.3 : 0.9);
        l.upper.rotation.z = upperTilt * (1 - fold) + -0.2 * fold;
        l.lower.rotation.z = (-0.8 + liftFoot) * (1 - fold) + -0.1 * fold;
      }

      // swimmerets: still when it walks, beating in a wave from front to back when it swims
      for (const p of s.pleopods) {
        p.stalk.rotation.z = fold * 0.8 * Math.sin(time * 34 - p.i * 0.8 + p.s * 0.2) + (1 - fold) * 0.08 * Math.sin(time * 3 + p.i);
      }

      // antennae sweep; they trail back and sweep faster when it shoots off or swims; the head dips to pick
      const flicking = s.state === 'flick';
      const swept = Math.max(flicking ? 1 : 0, fold);
      for (const a of s.antennae) {
        a.base.rotation.y = -a.s * (0.5 + swept * 1.9 + 0.12 * Math.sin(time * 1.3 + s.phase + a.s));
        a.base.rotation.z = -0.18;
        const groom = grooming ? 2.4 : 1;
        a.joints.forEach((j, i) => { j.rotation.y = -a.s * 0.16 * Math.sin(time * 2.2 * groom - i * 0.8 + s.phase + a.s * 1.4); j.rotation.z = -0.05; });
      }
      s.body.rotation.z = picking ? -0.12 * (0.5 + 0.5 * Math.sin(time * 3 + s.phase)) : 0;

      // the abdomen: curved down to the tail at rest, straight when swimming, curling right under on a flick
      const curl = flicking ? 0.5 * Math.sin(Math.PI * clamp(s.flickT / 0.6, 0, 1)) : 0;

  [0.310, 0.078, -0.090, 0.040, 2.30, 2.50],
  [0.280, 0.110, -0.118, 0.052, 2.20, 2.45],
  [0.240, 0.140, -0.140, 0.060, 2.15, 2.40],

  flank: [0.420, 0.470, 0.480],

  belly: [0.740, 0.755, 0.740],

/** Linear interpolation through the station table at an arbitrary x. */
function stationAt(x, livery) {
  const table = livery === 'clown' ? CLOWN_STATIONS : STATIONS;
  let i = 0;
  while (i < table.length - 2 && table[i + 1][0] > x) i++;
